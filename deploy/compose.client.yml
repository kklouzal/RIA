name: ria-client
services:
  client:
    image: ${CLIENT_IMAGE:?reviewed immutable CUDA image required}
    platform: linux/amd64
    entrypoint: [/usr/local/bin/ds4-server]
    command: [--config, /etc/dwarfstar/service.json]
    user: '10001:10001'
    runtime: nvidia
    init: true
    read_only: true
    restart: 'no'
    cpuset: ${CLIENT_CPUSET:?explicit CPU set required}
    mem_limit: ${CLIENT_CGROUP_BYTES:?admitted memory limit required}
    memswap_limit: ${CLIENT_CGROUP_BYTES:?same memory limit forbids swap}
    pids_limit: ${CLIENT_PIDS_LIMIT:?bounded process/thread count required}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:${SECCOMP_PROFILE:?reviewed profile required}
    ulimits:
      core: {soft: 0, hard: 0}
      memlock:
        soft: ${CLIENT_MEMLOCK_BYTES:?finite admitted locked population required}
        hard: ${CLIENT_MEMLOCK_BYTES:?finite admitted locked population required}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${CLIENT_GPU_UUID:?exact physical RTX5090 UUID required}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${CLIENT_GPU_UUID:?exact physical RTX5090 UUID required}']
              capabilities: [gpu]
    tmpfs:
      - /run/dwarfstar:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - {type: bind, source: '${CLIENT_MODEL_DIR:?existing prepared model directory required}', target: /model, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${CLIENT_CONFIG_DIR:?existing reviewed configuration directory required}', target: /etc/dwarfstar, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${CLIENT_SECRET_DIR:?existing credentials directory required}', target: /run/secrets, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: '${CLIENT_REPORT_DIR:?existing report directory required}', target: /artifacts, bind: {create_host_path: false}}
    ports:
      - '127.0.0.1:${CLIENT_API_PORT:?reviewed local API port required}:8000'
    healthcheck:
      test: [CMD, /usr/local/bin/ds4ctl, health, --socket, /run/dwarfstar/admin.sock, --timeout-ms, '5000']
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: ${CLIENT_START_PERIOD:?finite startup allowance required}
    stop_grace_period: ${CLIENT_STOP_GRACE:?finite drain allowance required}
